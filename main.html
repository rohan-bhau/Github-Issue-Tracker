<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issue Tracker</title>
    <!-- ? deisy ui-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ? favicon -->
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />


    <!-- ? font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
      * {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="p-6 flex justify-between border-b border-dotted sticky">
        <div class="flex items-center gap-3">
          <div class="w-[36px] h-[36px]">
            <img src="assets/github-logo.png" alt="" />
          </div>
          <p class="font-bold text-neutral text-xl">GitHub Issues Tracker</p>
        </div>

        <!-- ? search and add button -->
        <div class="flex gap-3">
            <div>
                <label class="input">
                  <svg
                    class="h-[1em] opacity-50"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                  >
                    <g
                      stroke-linejoin="round"
                      stroke-linecap="round"
                      stroke-width="2.5"
                      fill="none"
                      stroke="currentColor"
                    >
                      <circle cx="11" cy="11" r="8"></circle>
                      <path d="m21 21-4.3-4.3"></path>
                    </g>
                  </svg>
                  <input type="search" required placeholder="Search issues..." />
                </label>
            </div>
            <div>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i>New Issues</button>
            </div>
        </div>
      </div>
    </header>
  </body>
</html>
