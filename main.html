<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issue Tracker</title>
    <!-- ? deisy ui-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ? favicon -->
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />


    <!-- ? font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
      * {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body class="bg-base-200">
    <!-- ! navbar -->
    <header>
      <div class="p-6 flex justify-between border-b border-dotted sticky">
        <div class="flex items-center gap-3">
          <div class="w-[36px] h-[36px]">
            <img src="assets/github-logo.png" alt="" />
          </div>
          <p class="font-bold text-neutral text-xl">GitHub Issues Tracker</p>
        </div>

        <!-- ? search and add button -->
        <div class="flex gap-3">
            <div>
                <label class="input">
                  <svg
                    class="h-[1em] opacity-50"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                  >
                    <g
                      stroke-linejoin="round"
                      stroke-linecap="round"
                      stroke-width="2.5"
                      fill="none"
                      stroke="currentColor"
                    >
                      <circle cx="11" cy="11" r="8"></circle>
                      <path d="m21 21-4.3-4.3"></path>
                    </g>
                  </svg>
                  <input type="search" required placeholder="Search issues..." />
                </label>
            </div>
            <div>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i>New Issues</button>
            </div>
        </div>
      </div>
    </header>

    <!-- !tab buttons -->
<section class="">
    <div class="tabs mt-15 m-4 rounded-md p-4 pl-8 shadow bg-[#ffffff]">
        <button class="tab btn mr-2">All</button>
        <button class="tab btn mr-2">Open</button>
        <button class="tab btn">Closed</button>
    </div>
</section>

<!-- ! issues count -->
 <section class="flex justify-between p-6 m-4 bg-[#ffffff] rounded-md shadow">
    <div class=" flex items-center gap-3">

        <div class=" bg-primary-content w-[50px] h-[50px] p-2 rounded-full">

            <img src="assets/Aperture.png" alt="">
        </div>

        <div class="">
            <h2 class=" font-bold text-xl"><span id="issueCount ">0</span> Issues</h2>
            <p class="text-neutral/60">Track and manage your project issues </p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <i class="fa-solid fa-circle text-[#00a96e] w-[12px] h-[12px]"></i>
        <p class="font-bold text-xl">
            Open
        </p>
        <i class="fa-solid fa-circle text-[#A855F7] w-[12px] h-[12px]"></i>
        <p class="font-bold text-xl">Closed</p>
    </div>

 </section>

<!-- ! issues container -->
<section id="issues-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
</section>

<script src="js/data.js"></script>
  </body>
</html>
