<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issue Tracker</title>
    <!-- ? deisy ui-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ? favicon -->
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />


    <!-- ? font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
      * {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body class="bg-base-200">
    <!-- ! navbar -->
    <header>
      <div class="p-6 grid md:grid-cols-2 justify-between sm:grid sm:grid-cols-1 gap-3 border-b border-dotted sticky">
        <div class="flex items-center gap-3">
          <div class="w-[36px] h-[36px]">
            <img src="assets/github-logo.png" alt="" />
          </div>
          <p class="font-bold text-neutral text-xl">GitHub Issues Tracker</p>
        </div>

        <!-- ? search and add button -->
        <div class="flex gap-3 justify-end">
            <div>
                <label class="input">
                  <svg
                    class="h-[1em] opacity-50"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                  >
                    <g
                      stroke-linejoin="round"
                      stroke-linecap="round"
                      stroke-width="2.5"
                      fill="none"
                      stroke="currentColor"
                    >
                      <circle cx="11" cy="11" r="8"></circle>
                      <path d="m21 21-4.3-4.3"></path>
                    </g>
                  </svg>
                  <input id="searchInput" type="search" required placeholder="Search issues..." />
                </label>
            </div>
            <div>
                <button class="btn btn-primary md:text-[14px] lg:text-[14px] sm:text-[8px]"><i class="fa-solid fa-plus"></i>New Issues</button>
            </div>
        </div>
      </div>
    </header>

    <!-- !tab buttons -->
<section class="">
    <div class="tabs mt-15 m-4 rounded-md  p-8 shadow bg-[#ffffff]">
       
<button class="tab btn mr-2 text-neutral active btn-primary text-white" data-status="all">All</button>
<button class="tab btn mr-2  text-neutral" data-status="open">Open</button>
<button class="tab btn  text-neutral" data-status="closed">Closed</button>
    </div>
</section>

<!-- ! issues count -->
 <section class="grid md:grid-cols-2 lg:grid-cols-2 sm:grid-cols-1 p-6 m-4 bg-[#ffffff] rounded-md shadow">
    <div class=" flex items-center gap-3">

        <div class=" bg-primary-content w-[50px] h-[50px] p-2 rounded-full">

            <img src="assets/Aperture.png" alt="">
        </div>

        <div class="">
            <h2 class=" font-bold text-xl"><span id="issueCount">0</span> Issues</h2>
            <p class="text-neutral/60">Track and manage your project issues </p>
        </div>
    </div>
    <div class="flex items-center lg:justify-end md:justif-end gap-2">
        <i class="fa-solid fa-circle text-[#00a96e] w-[12px] h-[12px]"></i>
        <p class="font-bold text-lg">
            Open
        </p>
        <i class="fa-solid fa-circle text-[#A855F7] w-[12px] h-[12px]"></i>
        <p class="font-bold text-lg">Closed</p>
    </div>

 </section>

<!-- ! issues container -->
<section id="issues-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-4">
</section>

<!-- ! modal section -->

<dialog id="issueModal" class="modal">
  <div class="modal-box max-w-3xl rounded-lg">


    <h3 id="modalTitle" class="font-bold text-2xl mb-2"></h3>
    <div class="grid lg:grid-cols-3 md:grid-cols-3 sm:grid-cols-1  items-center gap-2 mb-6">
      <span id="modalStatus" class="badge badge-success uppercase text-sm rounded-full"></span>
      <li id="modalAuthor" class="text-neutral/60"></li>
      <li id="modalDate" class="text-neutral/60"></li>
    </div>

    <!-- Labels -->
    <div id="modalLabels" class="flex gap-2 mb-4"></div>

    <!-- Description -->
    <p id="modalDescription" class="mb-6 text-neutral/60 mb-6"></p>

    <!-- Assignee and Priority -->
     <div>
      <div class="grid grid-cols-2 p-4 bg-[#f8fafc] rounded-xl">
        <div>
            <h2 class="text-neutral/70">Assignee:</h2>
        <span id="modalAssignee" class="font-bold"></span>
        </div>
        <div>
          <h2 class="text-neutral/70">Priority:</h2>
          <span id="modalPriority" class="badge badge-error rounded-full uppercase px-3 py-1"></span>
        </div>
      </div>
    </div>

    <!-- Close button -->
    <div class="modal-action pt-6">
      <button id="closeModalBtn" class="btn btn-primary outline-none">Close</button>
    </div>

  </div>
</dialog>

<script src="js/data.js"></script>
<script src="js/tabs-functionality.js"></script>
<script src="js/search.js"></script>
<script src="js/modal.js"></script>
<script src="js/updateIssueCount.js"></script>
  </body>
</html>
